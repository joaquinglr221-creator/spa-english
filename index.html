<head>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/app/icon-192.png">
  <link rel="apple-touch-icon" href="images/app/apple-touch-icon.png">

  <!-- Pantalla de bienvenida: el loto aparece con movimiento y después el nombre de la app (se quita sola) -->
  <style>
    .splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #9a76b2 0%, #6d4d88 45%, #3f2a55 100%); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; transition: opacity .55s ease, transform .55s ease; }
    .splash.fuera { opacity: 0; transform: scale(1.06); pointer-events: none; }
    .splash-logo { position: relative; width: 210px; height: 210px; animation: sp-emerge 1s cubic-bezier(.2, 1.4, .4, 1) both; }
    .splash-logo::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55);
      animation: sp-onda 1.6s ease-out .35s both; }
    .splash-logo svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 22px rgba(20, 8, 35, .45)); }
    .sp-centro { transform-origin: 256px 346px; animation: sp-crece .7s cubic-bezier(.3, 1.5, .5, 1) .25s both; }
    .sp-izq { transform-origin: 256px 346px; animation: sp-izq .75s cubic-bezier(.3, 1.4, .5, 1) .5s both; }
    .sp-der { transform-origin: 256px 346px; animation: sp-der .75s cubic-bezier(.3, 1.4, .5, 1) .5s both; }
    .sp-agua { stroke-dasharray: 260; animation: sp-dibuja .8s ease-out .75s both; }
    .sp-estrella { transform-origin: 256px 110px; animation: sp-estrella .8s cubic-bezier(.3, 1.6, .5, 1) 1s both, sp-brilla 1.4s ease-in-out 1.8s infinite; }
    .splash-nombre { margin-top: 6px; text-align: center; }
    .splash-nombre b { display: block; font-size: 30px; font-weight: 800; letter-spacing: .5px; animation: sp-texto .7s ease-out 1.35s both; }
    .splash-nombre span { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: #f2c96b;
      animation: sp-texto .7s ease-out 1.6s both; }
    .splash-linea { width: 0; height: 2px; margin: 14px auto 0; border-radius: 2px; background: #f2c96b; animation: sp-linea .8s ease-out 1.85s both; }
    @keyframes sp-emerge { from { transform: translateY(40px) scale(.4); opacity: 0; } }
    @keyframes sp-onda { 0% { transform: scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes sp-crece { from { transform: scaleY(0); opacity: 0; } }
    @keyframes sp-izq { from { transform: rotate(40deg) scale(.6); opacity: 0; } }
    @keyframes sp-der { from { transform: rotate(-40deg) scale(.6); opacity: 0; } }
    @keyframes sp-dibuja { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
    @keyframes sp-estrella { from { transform: translateY(-90px) rotate(-180deg) scale(0); opacity: 0; } }
    @keyframes sp-brilla { 50% { filter: drop-shadow(0 0 10px #ffe39a); } }
    @keyframes sp-texto { from { transform: translateY(16px); opacity: 0; } }
    @keyframes sp-linea { to { width: 120px; } }
    @media (prefers-reduced-motion: reduce) { .splash *, .splash *::before { animation-duration: .01s !important; animation-delay: 0s !important; } }
  </style>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-logo">
      <svg viewBox="0 0 512 512">
        <g fill="#fff">
          <path class="sp-centro" d="M256 150c-26 36-38 74-38 110s12 64 38 86c26-22 38-50 38-86s-12-74-38-110z"/>
          <path class="sp-izq" d="M150 230c6 50 30 92 106 116-18-34-30-66-34-100-22-12-46-16-72-16z"/>
          <path class="sp-der" d="M362 230c-6 50-30 92-106 116 18-34 30-66 34-100 22-12 46-16 72-16z"/>
        </g>
        <path class="sp-agua" d="M150 384c26-14 52-14 78 0s52 14 78 0 52-14 78 0" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path class="sp-estrella" d="M256 70l13 27 30 4-22 21 5 30-26-14-26 14 5-30-22-21 30-4z" fill="#f2c96b"/>
      </svg>
    </div>
    <div class="splash-nombre"><b>SPA Service</b><span>Excellence App</span><div class="splash-linea"></div></div>
  </div>
  <script>
    // Se quita sola a los 3 s (o al tocarla).
    (function () {
      var s = document.getElementById("splash"), listo = false;
      function quitar() { if (listo) return; listo = true; s.classList.add("fuera"); setTimeout(function () { s.remove(); }, 600); }
      s.addEventListener("click", quitar);
      setTimeout(quitar, 3000);
    })();
  </script>
  <main id="app" class="container"></main>

</body>
</html>
